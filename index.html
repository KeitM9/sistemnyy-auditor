<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentProof — Multi-Agent System Audit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%20stroke%3D%22%23B4FAB2%22%20stroke-width%3D%222.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M16%2016%20C12.5%2010.5%208.5%209%206%2011%20C3.3%2013.2%203.3%2018.8%206%2021%20C8.5%2023%2012.5%2021.5%2016%2016%20C19.5%2010.5%2023.5%209%2026%2011%20C28.7%2013.2%2028.7%2018.8%2026%2021%20C23.5%2023%2019.5%2021.5%2016%2016%22/%3E%3Cpath%20d%3D%22M21.8%2016%20L24.4%2018.6%20L29.6%2012.4%22%20stroke%3D%22%232c3341%22%20stroke-width%3D%226%22/%3E%3Cpath%20d%3D%22M21.8%2016%20L24.4%2018.6%20L29.6%2012.4%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#232935; --panel:#2c3341; --surface:#252b37; --surface2:#333b49;
    --border:#454e60; --border2:#3a4252; --line:#5a6273;
    --mint:#B4FAB2; --mint-ink:#1c2530;
    --ink:#ffffff; --body:#d8dce2; --muted:#a4acba; --faint:#8891a0;
    --r:3px; --side:248px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--body);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
  h1,h2,h3{font-family:'Oswald',sans-serif;color:var(--ink);letter-spacing:.01em}
  ::placeholder{color:var(--muted)} ::selection{background:var(--mint);color:var(--mint-ink)}
  a{color:inherit;text-decoration:none}

  .app{display:flex;min-height:100vh}
  .side{width:var(--side);flex:none;background:var(--panel);border-right:1px solid var(--border2);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:11px;padding:20px 20px 18px;border-bottom:1px solid var(--border2)}
  .logo b{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;color:var(--ink);line-height:1.1;text-transform:uppercase;letter-spacing:.03em}
  .logo b i{display:block;font-style:normal;text-transform:none;font-size:10px;letter-spacing:.04em;color:var(--mint);font-weight:500;line-height:1.3;margin-top:2px}
  nav{padding:14px 12px;flex:1}
  .nav{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;cursor:pointer;color:var(--muted);font-family:'Manrope',sans-serif;font-size:14px;font-weight:500;text-align:left;padding:10px 12px;border-radius:var(--r);margin-bottom:2px;transition:.13s}
  .nav:hover{color:var(--ink);background:var(--surface)}
  .nav.on{color:var(--mint-ink);background:var(--mint);font-weight:600}
  .nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
  .sfoot{padding:16px 20px;border-top:1px solid var(--border2);font-size:11px;color:var(--faint);line-height:1.7}
  .sfoot a{color:var(--muted)} .sfoot a:hover{color:var(--mint)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 30px;border-bottom:1px solid var(--border2);position:sticky;top:0;background:rgba(35,41,53,.9);backdrop-filter:blur(8px);z-index:10}
  .top h1{font-weight:600;text-transform:uppercase;font-size:18px;letter-spacing:.04em}
  .topright{display:flex;align-items:center;gap:12px}
  .langbtn{font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--muted);background:none;border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;cursor:pointer;transition:.15s}
  .langbtn:hover{color:var(--ink);border-color:var(--mint)}
  .cta{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:13px;background:var(--mint);color:var(--mint-ink);border:none;border-radius:var(--r);padding:11px 20px;cursor:pointer;transition:filter .15s}
  .cta:hover{filter:brightness(1.06)} .cta:disabled{opacity:.5;cursor:default}
  .content{padding:30px;max-width:1080px;width:100%;flex:1}
  .view{display:none} .view.on{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .table{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}
  .tr{display:grid;grid-template-columns:1fr 130px 70px 120px;gap:14px;padding:13px 18px;align-items:center;border-top:1px solid var(--border2)}
  .tr:first-child{border-top:none;background:var(--surface2)}
  .tr.head{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;letter-spacing:.08em;color:var(--muted)}
  .tr .name{color:var(--ink);font-weight:600;font-size:14px}
  .tr .sc{font-family:'Oswald',sans-serif;font-weight:700;color:var(--ink)}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid var(--border);color:var(--muted)}
  .badge.ok{color:var(--mint-ink);background:var(--mint);border-color:var(--mint)}
  .badge.low{color:var(--faint);border-style:dashed}
  .tr .dt{color:var(--faint);font-size:13px}

  .work{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:24px;max-width:720px}
  .drop{border:1.5px dashed var(--border);border-radius:var(--r);background:var(--surface2);padding:32px 20px;text-align:center;cursor:pointer;transition:.18s}
  .drop:hover,.drop.over{border-color:var(--mint);background:#2c3543}
  .drop .t1{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:15px;color:var(--ink)}
  .drop .t2{color:var(--muted);font-size:13px;margin-top:6px} .drop .t3{color:var(--faint);font-size:12px;margin-top:9px;letter-spacing:.05em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:7px 11px;font-size:13px}
  .chip b{color:var(--ink)} .chip span{color:var(--faint)} .chip .rm{color:var(--faint);cursor:pointer;font-weight:700} .chip .rm:hover{color:var(--mint)}
  label.fl{display:block;font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase;font-size:12px;letter-spacing:.08em;color:var(--muted);margin:20px 0 8px}
  textarea{width:100%;min-height:110px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);color:var(--body);font-family:'Manrope',sans-serif;font-size:14px;line-height:1.6;padding:13px 14px;resize:vertical}
  textarea:focus{outline:none;border-color:var(--mint)}
  .actions{display:flex;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap}
  .safe{color:var(--faint);font-size:12px;max-width:38ch}
  .load{display:none;align-items:center;gap:10px;color:var(--mint);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:13px;margin-top:18px}
  .errbox{display:none;margin-top:16px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--mint);border-radius:var(--r);padding:12px 14px;color:var(--body);font-size:13.5px;max-width:560px}
  .spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--mint);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .rtop{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .rtop .nm{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:16px;color:var(--ink);letter-spacing:.03em}
  .scorechip{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:20px;padding:6px 14px}
  .scorechip b{font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;color:var(--ink)} .scorechip b em{font-style:normal;color:var(--muted);font-size:12px;font-weight:500}
  .scorechip s{text-decoration:none;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--mint)}
  .scorechip .dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}
  .graphwrap{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:22px 24px}
  .graphwrap h3{font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  .graphwrap .scroll{overflow-x:auto;padding:12px 0 4px}
  .legend{color:var(--faint);font-size:12px;margin-top:4px} .legend em{color:var(--mint);font-style:normal}
  .weak{background:var(--surface);border:1px solid var(--mint);border-radius:var(--r);padding:18px 22px;margin-top:16px}
  .weak .k{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.07em;color:var(--mint);margin-bottom:6px}
  .weak .v{color:var(--ink);font-size:15px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .block{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:20px 22px}
  .block>h3{font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--muted);margin-bottom:14px}
  .metric{padding:11px 0;border-top:1px solid var(--border2)} .metric:first-of-type{border-top:none;padding-top:0}
  .metric .rowt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .metric .lb{color:var(--ink);font-size:14px;font-weight:500} .metric .sc{font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;color:var(--mint)}
  .metric .nt{color:var(--muted);font-size:12.5px;margin:3px 0 8px}
  .item{padding:12px 0;border-top:1px solid var(--border2)} .item:first-of-type{border-top:none;padding-top:0}
  .item .k{color:var(--ink);font-weight:600;font-size:14px;margin-bottom:2px} .item .v{color:var(--muted);font-size:13px}
  .matched{margin-top:16px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:16px 22px}
  .matched h3{font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
  .matched .tags{display:flex;flex-wrap:wrap;gap:8px}
  .matched .tag{font-size:13px;color:var(--body);border:1px solid var(--border);border-radius:20px;padding:5px 12px}
  .chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
  .chain .st{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;font-size:13px;color:var(--ink)}
  .chain .ar{color:var(--mint);font-family:'Oswald',sans-serif;font-weight:700}
  .comp .cl{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--border2)} .comp .cl:first-child{border-top:none}
  .comp .mk{width:17px;height:17px;flex:none;border-radius:3px;border:1px solid var(--border);display:grid;place-items:center;font-size:11px;color:var(--faint)}
  .comp .mk.ok{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
  .comp .cl .t{color:var(--body);font-size:14px}
  .cert{display:flex;align-items:center;gap:18px;background:rgba(180,250,178,.045);border:1px solid var(--mint);border-radius:var(--r);padding:20px 22px;margin-top:16px;flex-wrap:wrap}
  .cert .seal{width:58px;height:58px;border:2px solid var(--mint);border-radius:var(--r);display:grid;place-items:center;flex:none}
  .cert .seal b{font-family:'Oswald',sans-serif;font-weight:700;color:var(--mint);font-size:19px}
  .cert .info b{font-family:'Oswald',sans-serif;text-transform:uppercase;color:var(--ink);font-size:14px;letter-spacing:.04em;display:block} .cert .info .m{color:var(--muted);font-size:12.5px;margin-top:3px}
  .fix{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:20px 22px;margin-top:16px}
  .fix>h3{font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}
  .fix ol{list-style:none;counter-reset:s}
  .fix li{counter-increment:s;position:relative;padding:9px 0 9px 40px;border-top:1px solid var(--border2);color:var(--body);font-size:14px} .fix li:first-child{border-top:none}
  .fix li::before{content:counter(s);position:absolute;left:0;top:9px;width:24px;height:24px;display:grid;place-items:center;font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;color:var(--mint);border:1px solid var(--border);border-radius:var(--r)}
  .pkrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px}
  .pklink{color:var(--mint);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
  #gate{max-width:560px}.gaterow{display:flex;gap:10px;flex-wrap:wrap}
  #codeIn{flex:1;min-width:220px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);color:var(--ink);font-family:'Manrope',sans-serif;font-size:15px;padding:11px 13px;letter-spacing:.02em}
  #codeIn:focus{outline:none;border-color:var(--mint)}
  .gatemsg{margin-top:12px;color:var(--muted);font-size:13px}.gatemsg a{color:var(--mint)}
  .gatemsg.bad{color:var(--ink);border-left:3px solid var(--mint);padding-left:10px}
  .codeok{color:var(--muted);font-size:13px;margin-bottom:14px}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;color:var(--body);font-size:13px;cursor:pointer}
  .consent input{margin-top:3px;accent-color:#B4FAB2}
  .fb{margin-top:20px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:18px 20px}
  .fb h3{font-size:15px;margin-bottom:10px}
  .stars{display:flex;gap:6px;margin-bottom:12px}.stars button{background:none;border:1px solid var(--border);border-radius:var(--r);color:var(--muted);font-family:'Oswald',sans-serif;font-size:15px;width:38px;height:34px;cursor:pointer}
  .stars button.on{background:var(--mint);color:var(--mint-ink);border-color:var(--mint)}
  .fb textarea{min-height:80px}.fb .consent{margin-top:10px}
  .fbdone{color:var(--body);font-size:14px}
  .warnbox{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--mint);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:var(--body)}
  .basis{margin-top:16px;color:var(--muted);font-size:12.5px}.basis b{color:var(--body);font-weight:600}
  .dl a.cta{text-decoration:none;display:inline-block}
  .dl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
  .dl span{color:var(--faint);font-size:12.5px}
  @media print{
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    html,body{background:var(--bg)!important;height:auto}
    .side,.top,.pfoot,.dl,.view:not(#report){display:none!important}
    .app,.main{display:block}.content{padding:0;max-width:none}
    #report{display:block!important;animation:none}
    .graphwrap .scroll{overflow:visible}
    .fxc,.block,.weak,.graphwrap{break-inside:avoid}
  }
  .fix2{margin-top:16px}
  .strongb{border-color:var(--border)}
  .chs .chr{display:grid;grid-template-columns:150px 110px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--border2);font-size:13.5px;color:var(--body)}
  .chs .chr:first-of-type{border-top:none}.chs .st-closed{color:var(--mint)}.chs .st-open{color:var(--ink);font-weight:600}.chs .st-unknown{color:var(--muted)}
  .gaps li{color:var(--body);font-size:13.5px;padding:4px 0}
  .fxb{font-family:'Manrope',sans-serif;font-size:11px;color:var(--muted);border:1px solid var(--border2);border-radius:var(--r);padding:1px 7px}
  .flagb{margin-left:8px;background:none;border:none;color:var(--muted);font:inherit;font-size:11px;cursor:pointer;text-decoration:underline}
  .comp .ev{color:var(--muted);font-size:12.5px;margin-left:28px}
  .spread{color:var(--muted);font-size:12px;margin:-4px 0 10px}
  @media(max-width:600px){.chs .chr{grid-template-columns:1fr 90px}.chs .chr span:last-child{grid-column:1/-1}}
  .finish{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 22px;margin-top:16px}
  .finish.done{border-color:var(--mint)}
  .finish h3,.retest h3{font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}
  .fl3{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--border2);font-size:14px;color:var(--body)}
  .fl3 .mk{color:var(--muted);font-weight:700}.fl3.ok .mk{color:var(--mint)}
  .fl3 .nw{color:var(--muted);font-size:12.5px}
  .finish .fin{margin-top:12px;font-size:14px;color:var(--ink)}.finish.done .fin{color:var(--mint);font-weight:600}
  .retest{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 22px;margin-top:16px}
  .retest .bs{font-family:'Oswald',sans-serif;font-size:30px;font-weight:700;color:var(--ink)}.retest .bs em{font-style:normal;color:var(--muted);font-size:22px;margin:0 10px}
  .retest .cnt{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:var(--body)}.retest .cnt b{color:var(--mint);font-family:'Oswald',sans-serif;font-size:16px;margin-right:4px}
  .fxs{margin-left:auto;font-family:'Manrope',sans-serif;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mint)}
  .fxs.open{color:var(--muted)}
  .fxid{font-family:'Manrope',sans-serif;font-size:11px;color:var(--muted)}
  .acc{display:flex;gap:10px;align-items:center;padding:9px 16px;font-size:13px;color:var(--body);cursor:pointer}
  .closed .fxc{opacity:.85}.closed .fxh{border-bottom:none}
  .prevsel{width:100%;margin-top:6px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;font:inherit}
  .fix2>h3{font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}
  .fxc{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
  .fxh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface2,#333b49);border-bottom:1px solid var(--border2);font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;color:var(--ink)}
  .fxp{font-family:'Manrope',sans-serif;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:var(--r);padding:2px 8px}
  .fxr{display:grid;grid-template-columns:112px 1fr;gap:13px;padding:9px 16px;border-bottom:1px solid var(--border2);font-size:13.5px}
  .fxr:last-child{border-bottom:none}
  .fxk{font-family:'Oswald',sans-serif;font-weight:500;color:var(--mint);font-size:13px}
  .fxv{color:var(--body)}
  @media(max-width:560px){.fxr{grid-template-columns:1fr;gap:3px}}
  .disc{color:var(--faint);font-size:12px;margin-top:20px;line-height:1.6}

  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(620px 420px at 74% 14%, rgba(180,250,178,.07), transparent 62%)}
  .content{position:relative;z-index:1}
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding:40px 0 24px}
  .bp{color:var(--ink);letter-spacing:inherit}
  .bp em{font-style:normal;color:var(--mint)}
  .eyebrow{display:inline-block;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.22em;color:var(--mint);border:1px solid var(--border);border-radius:20px;padding:6px 14px;margin-bottom:24px}
  .htitle{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(40px,5.4vw,64px);line-height:.95;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}

function graphSVG(g){
  const nw=118,nh=48,yc=30,H=118,N=g.nodes.length;
  const W=Math.max(700,20+N*(nw+44));
  const step=(W-20-nw)/(N-1), pos={};
  g.nodes.forEach((n,i)=>pos[n.id]={x:10+i*step,y:yc});
  const edges=g.edges.map(e=>{const a=pos[e.f],b=pos[e.t];const x1=a.x+nw,y1=a.y+nh/2,x2=b.x,y2=b.y+nh/2;
    const c=e.weak?'#B4FAB2':'#5a6273',w=e.weak?3:1.6,d=e.weak?'7 5':'0';
    const lb=e.label?`<text x="${(x1+x2)/2}" y="${y1-9}" fill="#B4FAB2" font-size="11" text-anchor="middle" font-family="Oswald" letter-spacing="1">${e.label.toUpperCase()}</text>`:'';
    return `<line x1="${x1}" y1="${y1}" x2="${x2-7}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-dasharray="${d}"/><polygon points="${x2-7},${y2-4} ${x2},${y2} ${x2-7},${y2+4}" fill="${c}"/>${lb}`;}).join('');
  const nodes=g.nodes.map(n=>{const p=pos[n.id],leak=!!n.leak,st=leak?'#B4FAB2':'#454e60';
    const tag=(n.flags||[]).length?`<text x="${p.x+nw/2}" y="${p.y+nh+16}" fill="${leak?'#B4FAB2':'#8891a0'}" font-size="10.5" text-anchor="middle" font-family="Manrope">${n.flags.join(' · ')}</text>`:'';
    return `<rect x="${p.x}" y="${p.y}" width="${nw}" height="${nh}" rx="3" fill="${n.io?'#232935':'#333b49'}" stroke="${st}" stroke-width="${leak?2:1}"/><text x="${p.x+nw/2}" y="${p.y+nh/2+4}" fill="#f1f3f3" font-size="13" text-anchor="middle" font-family="Manrope" font-weight="600">${n.label}</text>${tag}`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" height="118" preserveAspectRatio="xMinYMid meet" style="min-width:${W}px">${edges}${nodes}</svg>`;
}

  const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]==null?'':k==='date'?new Date(o[k]).toLocaleDateString(lang==='en'?'en':'ru'):typeof o[k]==='number'?o[k].toLocaleString(lang==='en'?'en':'ru'):o[k]);
  const b=r.basis, trunc=b&&b.total>b.checked;
  const axes=(r.axes||[]).map(a=>`<div class="metric"><div class="rowt"><span class="lb">${a.t}</span><span class="sc">${a.s}/10</span></div><div class="nt">${a.why}</div><div class="track"><i style="width:${a.s*10}%"></i></div></div>`).join('');
  const chain=((r.exploit&&r.exploit.path)||[]).map((s,i)=>`${i?'<span class="ar">→</span>':''}<span class="st">${s}</span>`).join('');
  const comp=((r.compliance&&r.compliance.items)||[]).map(c=>`<div class="cl"><span class="mk ${c.ok?'ok':''}">${c.ok?'✓':'·'}</span><span class="t">${c.t}${c.st?` · ${t('cs_'+c.st)}`:''}</span></div>${c.ev?`<div class="ev">${c.ev}</div>`:''}`).join('');
  $('#report').innerHTML=`
    <div class="rtop">
      <span class="nm">${r.name||''}</span>
      <span class="scorechip"><span class="dot"></span><b>${r.score}<em> / 10</em></b><s>${r.verdict}</s></span>
    </div>
    ${retest}${finish}
    <div class="graphwrap">
      <h3>${t('rep_mapTitle')}</h3>
      <div class="scroll">${graphSVG(r.graph)}</div>
      <div class="legend">${t('rep_legend')}</div>
    </div>
    ${trunc?`<div class="warnbox">${fill(t('trunc_txt'),b)}</div>`:''}
    <div class="weak"><div class="k">${t('rep_weak')}</div><div class="v">${r.weak}</div></div>
    ${r.strong?`<div class="weak strongb"><div class="k">${t('rep_strong')}</div><div class="v">${r.strong}</div></div>`:''}
    ${axes?`<div class="block" style="margin-top:16px"><h3>${t('rep_axes')}</h3>${r.spread?`<div class="spread">${t('rep_spread').replace('{n}',r.spread)}</div>`:''}${axes}</div>`:''}
    <div class="cols"><div class="block"><h3>${t('rep_battery')}</h3>${bat}</div><div class="block"><h3>${t('rep_system')}</h3>${sys}</div></div>
    ${chHtml}${gapsHtml}
    ${tags?`<div class="matched"><h3>${t('rep_matched')}</h3><div class="tags">${tags}</div></div>`:''}
    ${r.exploit?`<div class="block" style="margin-top:16px"><h3>${t('rep_attack')}</h3><div class="chain">${chain}</div><div style="color:var(--muted);font-size:12.5px;margin-top:11px">${r.exploit.note}</div></div>`:''}
    ${r.compliance?`<div class="block comp" style="margin-top:16px"><h3>${t('rep_comp')} · ${r.compliance.ref}</h3>${comp}</div>`:''}
    ${r.cert?`<div class="cert"><div class="seal"><b>${r.score}</b></div><div class="info"><b>${t('rep_cert')}</b><div class="m">Architect Systems AI · ${r.cert.id} · ${r.cert.valid} · ${r.cert.level}</div></div></div>`:''}
    ${hard?`<div class="fix2"><h3>${t('rep_fix2')}</h3>${hard}</div>`:(steps&&!H.length?`<div class="fix"><h3>${t('rep_fix')}</h3><ol>${steps}</ol></div>`:'')}${closedHtml}
    ${b?`<div class="basis"><b>${t('rep_basis')}.</b> ${fill(t('basis_txt'),{...b,rubric:r.rubric||''})}</div>`:''}
    <div class="disc">${t('rep_disc')}</div>
    <div class="dl"><a class="cta" href="https://t.me/arsysai_bot?start=agentproof" target="_blank" rel="noopener">${t('rep_talk')}</a><span>${t('rep_talk_hint')}</span></div>
    <div class="dl"><button class="langbtn" id="pdfBtn">${t('rep_pdf')}</button><span>${t('rep_pdf_hint')}</span></div>
    ${r._code&&!isDemo?`<div class="fb" id="fb"><h3>${t('fb_title')}</h3>
      <div class="stars">${[1,2,3,4,5].map(n=>`<button type="button" data-s="${n}">${n}</button>`).join('')}</div>
      <textarea id="fbText" placeholder="${t('fb_ph')}"></textarea>
      <label class="consent"><input type="checkbox" id="fbHelp"><span>${t('fb_help')}</span></label>
      <label class="consent"><input type="checkbox" id="fbShare"><span>${t('fb_share')}</span></label>
      <div class="dl"><button class="cta" id="fbSend">${t('fb_send')}</button><span id="fbMsg"></span></div></div>`:''}`;
  if($('#fb')){let stars=0;
    $$('#fb .stars button').forEach(b=>b.onclick=()=>{stars=+b.dataset.s;$$('#fb .stars button').forEach(x=>x.classList.toggle('on',+x.dataset.s<=stars));});
    $('#fbSend').onclick=async()=>{const help=$('#fbHelp').checked;$('#fbSend').disabled=true;
      try{const res=await fetch(ENGINE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'feedback',code:r._code,lang,feedback:{stars,text:$('#fbText').value.trim(),help,share:$('#fbShare').checked,score:r.score}})});
        if(!res.ok)throw 0;$('#fb').innerHTML=`<div class="fbdone">${t('fb_thanks')}${help?t('fb_thanks_help'):''}</div>`;}
      catch(e){$('#fbSend').disabled=false;$('#fbMsg').textContent=t('fb_err');}};}
  $$('#report [data-acc]').forEach(c=>c.onchange=()=>{const a=accOf(r).filter(x=>x!==c.dataset.acc);if(c.checked)a.push(c.dataset.acc);accSet(r,a);const y=window.scrollY;render(r);window.scrollTo({top:y});});
  $$('#report [data-flag]').forEach(b=>b.onclick=async()=>{const h=(r.hardening||[]).find(x=>x.id===b.dataset.flag);if(!h)return;
    const why=window.prompt(t('flag_q'),'');if(why===null)return;b.disabled=true;
    try{const res=await fetch(ENGINE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'flag',code:r._code,lang,flag:{rubric:r.rubric,lib:r.lib,cls:h.cls,p:h.p,t:h.t,why}})});if(!res.ok)throw 0;b.textContent=t('flag_ok');}
    catch(e){b.disabled=false;}});
  $('#pdfBtn').onclick=()=>{const old=document.title;document.title='AgentProof — '+(r.name||'отчёт').replace(/<[^>]*>/g,'');window.print();document.title=old;};
  if(curView!=='report')show('report');
}

function applyLang(){
  document.documentElement.lang=lang;
  $$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  $$('[data-i18n-html]').forEach(e=>e.innerHTML=t(e.dataset.i18nHtml));
  $$('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  $('#title').textContent=t(TITLES[curView]||'t_overview');
  $('#langbtn').textContent = lang==='ru'?'EN':'RU';
  if($('#heroViz')) $('#heroViz').innerHTML=heroGraph();
  buildTables();
  if($('#report').classList.contains('on')&&isDemo) render(DEMO[lang]);
}

// nav + controls
$$('.nav[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));
$$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('#newBtn').onclick=()=>show('new');
$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#langbtn').onclick=()=>{lang=lang==='ru'?'en':'ru';try{localStorage.setItem('asa_lang',lang);}catch(e){}applyLang();};
var isDemo=false; // var: applyLang может вызваться раньше этой строки
$('#demoBtn').onclick=()=>{isDemo=true;render(DEMO[lang]);};

// upload
const store=[];
function renderChips(){const more=store.length-12;$('#chips').innerHTML=store.slice(0,12).map((f,i)=>`<span class="chip"><b>${f.name}</b> <span>${(f.text.length/1024).toFixed(1)} ${t('kb')}</span><span class="rm" data-i="${i}">✕</span></span>`).join('')+(more>0?`<span class="chip"><span>${t('more_files').replace('{n}',more)}</span></span>`:'');$$('.chip .rm').forEach(x=>x.onclick=()=>{store.splice(+x.dataset.i,1);renderChips();});}
// Word (.docx) читаем в браузере библиотекой mammoth — подгружается только когда нужна.
const loadMammoth=()=>window.mammoth?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.12.3/mammoth.browser.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s);});
function fileErr(name){$('#err').textContent=t('file_err').replace('{f}',name);$('#err').style.display='block';}
const OK_EXT=/\.(md|txt|docx|json|ya?ml|log|csv|xml|toml|py|jsx?|tsx?|mjs|cjs)$|\.env\.example$/i;
const SKIP_DIR=/(^|\/)(node_modules|\.git|\.venv|venv|__pycache__|dist|build|\.next|\.vercel|coverage)(\/|$)/;
const SKIP_NAME=/(^|\/)\.env(?!\.example$)[^/]*$|\.(pem|key|p12|pfx|crt|sqlite|db|dump)$|(^|\/)package-lock\.json$/i;
const MAX_TOTAL=4*1024*1024;
function note(k,n){$('#err').textContent=t(k).replace('{n}',n);$('#err').style.display='block';}
function addFiles(list){
  const all=[...list]; let skipped=0;
  const keep=all.filter(f=>{const path=f.webkitRelativePath||f.name;
    const ok=OK_EXT.test(f.name)&&!SKIP_DIR.test(path)&&!SKIP_NAME.test(path); if(!ok)skipped++; return ok;});
  if(skipped)note('skipped',skipped);
  keep.forEach(async f=>{
  try{
    let text;
    if(/\.docx$/i.test(f.name)){await loadMammoth();text=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;}
    else text=await f.text();
    if(!text.trim())return fileErr(f.name);
    const size=store.reduce((s,x)=>s+x.text.length,0)+text.length;
    if(size>MAX_TOTAL)return note('too_big','');
    store.push({name:f.webkitRelativePath||f.name,text});renderChips();
  }catch(e){fileErr(f.name);}
});}
const drop=$('#drop'),fi=$('#file');
drop.onclick=()=>fi.click(); fi.onchange=()=>addFiles(fi.files);
$('#dirBtn').onclick=()=>$('#dir').click(); $('#dir').onchange=()=>addFiles($('#dir').files);
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',ev=>addFiles(ev.dataTransfer.files));
const ENGINE='https://agentproof-engine.vercel.app/api/audit';
// Личный код живёт в этой вкладке (sessionStorage); проверку проводит только сервер.
let memCode=''; // запас, если браузер запрещает хранилище (приватный режим)
const getCode=()=>{try{return sessionStorage.getItem('ap_code')||memCode}catch(e){return memCode}};
const setCode=c=>{memCode=c||'';try{c?sessionStorage.setItem('ap_code',c):sessionStorage.removeItem('ap_code')}catch(e){}};
function gateView(){const on=!!getCode();$('#gate').style.display=on?'none':'block';$('#formwrap').style.display=on?'block':'none';}
function gateMsg(k){const m=$('#gateMsg');m.innerHTML=t(k);m.classList.toggle('bad',k!=='gate_help');}
$('#codeBtn').onclick=async()=>{const code=$('#codeIn').value.trim(); if(!code){$('#codeIn').focus();return;}
  $('#codeBtn').disabled=true;
  try{const res=await fetch(ENGINE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'check',code,lang})});
    if(res.status===401)return gateMsg('code_bad'); if(res.status===410)return gateMsg('code_expired'); if(!res.ok)return gateMsg('code_off');
    const j=await res.json(); if(j.used)return gateMsg('code_used');
    setCode(code); gateMsg('gate_help');
    $('#codeOk').textContent=t('code_ok').replace('{d}',new Date(j.expires*1000).toLocaleString(lang==='en'?'en':'ru',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}));
    gateView();}
  catch(e){gateMsg('code_off');} finally{$('#codeBtn').disabled=false;}};
$('#codeIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#codeBtn').click();});
gateView();
$('#run').addEventListener('click',async()=>{
  const parts=[]; if($('#sys').value.trim())parts.push($('#sys').value.trim());
  store.forEach(f=>parts.push(`# ${f.name}\n${f.text}`));
  const system=parts.join('\n\n'); if(!system){$('#sys').focus();return;}
  $('#err').style.display='none';
  if(!$('#agree').checked){$('#err').textContent=t('consent_need');$('#err').style.display='block';return;}
  const code=getCode(); if(!code){gateView();return;}
  $('#run').disabled=true; $('#load').style.display='flex'; $('#err').textContent=t('err_txt');
  const pr=$('#prevSel').value!==''?loadReps()[+$('#prevSel').value]:null;
  const prev=pr?{score:pr.rep.score,items:(pr.rep.hardening||[]).map((h,i)=>({id:h.id||`F${i+1}`,p:h.p,cls:h.cls||'',t:h.t}))}:null;
  // Три шага; описание уходит на каждом шаге заново и нигде не хранится. Сбой шага — один повтор.
  const step=async(extra,msg)=>{$('#loadMsg').textContent=t(msg);
    for(let i=0;i<2;i++){const res=await fetch(ENGINE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,system,lang,...extra})});
      if(res.status===401||res.status===410){setCode('');gateView();gateMsg(res.status===410?'code_expired':'code_bad');throw 'stop';}
      if(res.status===429){$('#err').textContent=t('err_429');throw 0;}
      if(res.status===409){const j=await res.json().catch(()=>({}));if(j.error==='used'){setCode('');gateView();gateMsg('code_used');throw 'stop';}$('#err').textContent=t('err_running');throw 0;}
      if(res.ok)return res.json();
      if(extra.action==='map'||i)throw 0;}};
  try{let sealed=await step({action:'map'},'load_map');
    sealed=await step({action:'probe',sealed},'load_probe');
    const rep=await step({action:'final',sealed,prev},'load_final');
    rep._code=code; isDemo=false; saveRep(rep); setCode(''); gateView(); render(rep);}
  catch(e){if(e!=='stop')$('#err').style.display='block';}
  finally{$('#run').disabled=false;$('#load').style.display='none';}
});
$('#delReps').onclick=()=>{if(!confirm(t('del_ok')))return;try{localStorage.removeItem('ap_reports')}catch(e){}buildTables();};

// reveal on scroll
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
$$('.reveal').forEach(el=>io.observe(el));

// hero graph container lives inside herovals? no — it's the video. heroGraph goes to #heroViz if present.
applyLang();
</script>
